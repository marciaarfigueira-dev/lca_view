<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Notebook | LCA - Field emissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./pivot.css" />
</head>

<body>
  <div class="page">
    <header class="top-bar">
      <div>
        <p class="eyebrow">Digital Notebook | LCA</p>
        <h1>Field emission impacts</h1>
        <p class="lede">
          Browse methane, nitrous oxide, straw, volatilisation, leaching, and urea CO2 impacts by farmer-year.
        </p>
      </div>
      <div class="pill">
        <span class="dot"></span>
        <span>CH4 + N2O</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel filters">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Filters</p>
            <h2>Scope</h2>
          </div>
          <div class="panel-actions">
            <button class="ghost" id="reset-filters">Reset</button>
            <a class="ghost" href="./bioregional.html">Back</a>
          </div>
        </div>
        <div class="filter-grid">
          <label class="field">
            <span>Year</span>
            <select id="season-filter"></select>
          </label>
          <label class="field">
            <span>Farmer</span>
            <select id="farmer-filter"></select>
          </label>
          <label class="field">
            <span>Impact basis</span>
            <select id="basis-filter">
              <option value="ha">Per hectare</option>
              <option value="tonne">Per tonne</option>
            </select>
          </label>
          <label class="field">
            <span>Impact type</span>
            <select id="score-filter">
              <option value="chara">Characterisation</option>
              <option value="single">Single score</option>
            </select>
          </label>
          <label class="field">
            <span>Emission source</span>
            <select id="gas-filter"></select>
          </label>
          <label class="field">
            <span>Emission component</span>
            <select id="component-filter"></select>
          </label>
        </div>
        <div class="chip" id="active-filters"></div>
      </section>

      <section class="panel stats">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h2>Snapshot</h2>
          </div>
        </div>
        <div class="stat-grid" id="stat-grid"></div>
      </section>

      <section class="panel pivot">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Summary</p>
            <h2>Mean impact by component</h2>
          </div>
          <div class="chip muted" id="summary-count"></div>
        </div>
        <div id="summary-table" class="table-shell"></div>
      </section>

      <section class="panel detail">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Detail</p>
            <h2>Rows</h2>
          </div>
          <div class="chip muted" id="detail-count"></div>
        </div>
        <div id="detail-table" class="table-shell"></div>
      </section>
    </main>
  </div>
  <script src="./i18n.js"></script>
  <script src="./context-back.js"></script>
  <script type="module" src="./lca-field-emissions.js"></script>
</body>

</html>
