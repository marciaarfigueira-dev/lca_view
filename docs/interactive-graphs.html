<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Notebook | Interactive Graphs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./pivot.css" />
</head>

<body class="interactive-graphs-page">
  <div class="page">
    <header class="top-bar">
      <div>
        <p class="eyebrow">Digital Notebook | Interactive Graphs</p>
        <h1>Stacked impact categories</h1>
        <p class="lede">
          Compare mean farmer-year impacts across input sources and impact categories.
        </p>
      </div>
      <div class="pill">
        <span class="dot"></span>
        <span>All sources</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel filters">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Filters</p>
            <h2>Graph scope</h2>
          </div>
          <div class="panel-actions">
            <a class="ghost" href="./bioregional.html">Back</a>
            <button class="ghost" id="reset-filters">Reset</button>
          </div>
        </div>
        <div class="filter-grid">
          <label class="field">
            <span>Year</span>
            <select id="season-filter"></select>
          </label>
          <label class="field">
            <span>Farmer</span>
            <select id="farmer-filter"></select>
          </label>
          <label class="field">
            <span>Impact basis</span>
            <select id="basis-filter">
              <option value="ha">Per hectare</option>
              <option value="tonne">Per tonne</option>
            </select>
          </label>
          <label class="field">
            <span>Impact type</span>
            <select id="score-filter">
              <option value="single">Single score</option>
              <option value="chara">Characterisation</option>
            </select>
          </label>
          <label class="field">
            <span>Graph scale</span>
            <select id="scale-filter">
              <option value="absolute">Absolute value</option>
              <option value="share">100% contribution</option>
            </select>
          </label>
          <label class="field">
            <span>Aggregation</span>
            <select id="aggregation-filter">
              <option value="equal_mean">Equal-weight mean</option>
              <option value="area_weighted">Area-weighted mean</option>
              <option value="production_weighted">Production-weighted mean</option>
              <option value="sum">Total burden</option>
            </select>
          </label>
          <label class="field">
            <span>Categories</span>
            <select id="limit-filter">
              <option value="12">Top 12</option>
              <option value="20">Top 20</option>
              <option value="all">All</option>
            </select>
          </label>
        </div>
        <div class="chip" id="active-filters"></div>
      </section>

      <section class="panel stats">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h2>Snapshot</h2>
          </div>
        </div>
        <div class="stat-grid" id="stat-grid"></div>
      </section>

      <section class="panel pivot">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Stacked Chart</p>
            <h2>Input-source contribution by impact category</h2>
          </div>
          <div class="chip muted" id="chart-count"></div>
        </div>
        <div id="legend" class="legend"></div>
        <div id="stacked-chart" class="stacked-chart"></div>
      </section>

      <section class="panel detail">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Detail</p>
            <h2>Graph values</h2>
          </div>
          <div class="chip muted" id="detail-count"></div>
        </div>
        <div id="detail-table" class="table-shell"></div>
      </section>
    </main>
  </div>
  <script src="./i18n.js"></script>
  <script src="./context-back.js"></script>
  <script type="module" src="./interactive-graphs.js"></script>
</body>

</html>
